repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run isort.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --select, I, --fix ]
    # Run the formatter.
    - id: ruff-format
      # args: [--diff]
      types_or: [ python, pyi ]
  - repo: https://github.com/conda-incubator/pre-commit-mirrors-insert-license
    rev: 1.3.0
    hooks:
    - id: insert-license
      types: [ python ]
      args:
        - --dynamic-years
        - --license-base64
        - "Q29weXJpZ2h0IChjKSB7eWVhcl9zdGFydH0te3llYXJfZW5kfSwgU2ViYXN0aWVuIFBpZXJhcmQgZXQgYWwuClNQRFgtTGljZW5zZS1JZGVudGlmaWVyOiBBcGFjaGUtMi4wCg=="
